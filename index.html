<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P2P 连通测试 · 聊天</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js">
    </script>
    <style>
        /* 全局灰白黑主色调，无圆角过多装饰，极简风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #2c2c2c;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .app {
            background: #f5f5f5;
            color: #1e1e1e;
            width: 100%;
            max-width: 480px;
            border-radius: 12px;
            padding: 24px 20px 28px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #1e1e1e;
            border-bottom: 2px solid #9e9e9e;
            padding-bottom: 10px;
            margin-bottom: 4px;
        }
        .role-selector {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .role-selector button {
            flex: 1;
            min-width: 80px;
            padding: 10px 0;
            background: #d0d0d0;
            border: none;
            font-size: 1rem;
            font-weight: 500;
            color: #1e1e1e;
            cursor: pointer;
            transition: background 0.15s;
            border-radius: 6px;
        }
        .role-selector button.active {
            background: #9e9e9e;
            color: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .role-selector button:hover {
            background: #bdbdbd;
        }
        .connection-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #e8e8e8;
            padding: 16px 14px;
            border-radius: 8px;
        }
        .connection-panel .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .connection-panel label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #2c2c2c;
            min-width: 60px;
        }
        .connection-panel input {
            flex: 1;
            min-width: 120px;
            padding: 8px 10px;
            border: 1px solid #9e9e9e;
            border-radius: 4px;
            background: #ffffff;
            color: #1e1e1e;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.15s;
        }
        .connection-panel input:focus {
            border-color: #555555;
        }
        .connection-panel .action-btn {
            padding: 8px 18px;
            background: #3a3a3a;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .connection-panel .action-btn:hover {
            background: #1e1e1e;
        }
        .connection-panel .action-btn:disabled {
            opacity: 0.5;
            cursor: default;
            background: #6e6e6e;
        }
        .status {
            font-size: 0.9rem;
            color: #3a3a3a;
            background: #d6d6d6;
            padding: 8px 12px;
            border-radius: 4px;
            word-break: break-all;
            min-height: 2.4em;
            display: flex;
            align-items: center;
        }
        .chat-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #e8e8e8;
            border-radius: 8px;
            padding: 16px 14px;
        }
        .messages {
            background: #ffffff;
            border: 1px solid #b0b0b0;
            border-radius: 4px;
            height: 180px;
            overflow-y: auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.95rem;
            color: #1e1e1e;
        }
        .messages .msg {
            padding: 4px 0;
            border-bottom: 1px solid #e0e0e0;
            word-break: break-word;
        }
        .messages .msg:last-child {
            border-bottom: none;
        }
        .messages .msg .sender {
            font-weight: 600;
            color: #2c2c2c;
        }
        .messages .msg .sender.me {
            color: #5a5a5a;
        }
        .chat-input-row {
            display: flex;
            gap: 10px;
        }
        .chat-input-row input {
            flex: 1;
            padding: 8px 10px;
            border: 1px solid #9e9e9e;
            border-radius: 4px;
            background: #ffffff;
            color: #1e1e1e;
            font-size: 0.95rem;
            outline: none;
        }
        .chat-input-row input:focus {
            border-color: #555555;
        }
        .chat-input-row button {
            padding: 8px 18px;
            background: #3a3a3a;
            border: none;
            border-radius: 4px;
            color: #ffffff;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s;
        }
        .chat-input-row button:hover {
            background: #1e1e1e;
        }
        .chat-input-row button:disabled {
            opacity: 0.4;
            cursor: default;
            background: #6e6e6e;
        }
        .footer-hint {
            font-size: 0.8rem;
            color: #6e6e6e;
            text-align: center;
            border-top: 1px solid #c0c0c0;
            padding-top: 12px;
            margin-top: 4px;
        }
        .disabled-input {
            background: #d6d6d6 !important;
            color: #5a5a5a;
        }
    </style>
</head>
<body>
<div class="app">
    <h1>P2P 连通测试</h1>
    <div class="role-selector">
        <button id="btnHost" class="active">主机 (创建房间)</button>
        <button id="btnClient">客户端 (加入房间)</button>
    </div>
    <div class="connection-panel">
        <div class="row">
            <label for="roomIdInput">房间 ID</label>
            <input type="text" id="roomIdInput" placeholder="输入房间标识" value="test-room" />
        </div>
        <div class="row" style="justify-content: flex-end;">
            <button id="actionBtn" class="action-btn">创建房间</button>
        </div>
        <div class="status" id="statusDisplay">就绪 · 请选择角色并操作</div>
    </div>
    <div class="chat-area">
        <div class="messages" id="messageList">
            <div class="msg" style="color:#6e6e6e; font-style:italic; border-bottom:none;">等待连接…</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="输入消息…" disabled />
            <button id="sendBtn" disabled>发送</button>
        </div>
    </div>
    <div class="footer-hint">基于 WebRTC (PeerJS) · 使用公共信令服务器</div>
</div>

<script>
    (function() {
        const btnHost = document.getElementById('btnHost');
        const btnClient = document.getElementById('btnClient');
        const roomInput = document.getElementById('roomIdInput');
        const actionBtn = document.getElementById('actionBtn');
        const statusDisplay = document.getElementById('statusDisplay');
        const messageList = document.getElementById('messageList');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        let currentRole = 'host';
        let peer = null;
        let connection = null;
        let isConnected = false;
        let myPeerId = null;
        let remotePeerId = null;

        function setStatus(msg, isError = false) {
            statusDisplay.textContent = msg;
            statusDisplay.style.color = isError ? '#b00020' : '#3a3a3a';
        }

        function appendMessage(sender, text, isMe = false) {
            const placeholder = messageList.querySelector('.msg[style*="italic"]');
            if (placeholder && messageList.children.length === 1) {
                messageList.innerHTML = '';
            }
            const div = document.createElement('div');
            div.className = 'msg';
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender' + (isMe ? ' me' : '');
            senderSpan.textContent = sender + ': ';
            const textSpan = document.createElement('span');
            textSpan.textContent = text;
            div.appendChild(senderSpan);
            div.appendChild(textSpan);
            messageList.appendChild(div);
            messageList.scrollTop = messageList.scrollHeight;
        }

        function setUIEnabled(enabled) {
            chatInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
            if (!enabled) chatInput.value = '';
        }

        // 修正后的重置函数：不再干预按钮文字
        function resetToInitial() {
            if (connection) {
                try { connection.close(); } catch (e) {}
                connection = null;
            }
            if (peer) {
                try { peer.destroy(); } catch (e) {}
                peer = null;
            }
            isConnected = false;
            myPeerId = null;
            remotePeerId = null;
            setUIEnabled(false);
            messageList.innerHTML = '<div class="msg" style="color:#6e6e6e; font-style:italic; border-bottom:none;">等待连接…</div>';
            roomInput.disabled = false;
            roomInput.classList.remove('disabled-input');
            setStatus('就绪 · 请选择角色并操作');
            // 注意：actionBtn.textContent 由角色切换事件维护，这里不修改
        }

        function handleReceivedMessage(data) {
            if (typeof data === 'string') {
                try {
                    const parsed = JSON.parse(data);
                    if (parsed.type === 'chat' && parsed.text) {
                        appendMessage(parsed.sender || '对方', parsed.text, false);
                        return;
                    }
                } catch (e) {}
                appendMessage('对方', data, false);
            }
        }

        function sendChatMessage(text) {
            if (!isConnected || !connection || connection.open === false) {
                setStatus('未连接，无法发送', true);
                return;
            }
            const payload = JSON.stringify({
                type: 'chat',
                text: text,
                sender: currentRole === 'host' ? '主机' : '客户端'
            });
            try {
                connection.send(payload);
                appendMessage('我', text, true);
                chatInput.value = '';
                chatInput.focus();
            } catch (err) {
                setStatus('发送失败: ' + err.message, true);
            }
        }

        function onConnectionEstablished(conn, isInitiator) {
            connection = conn;
            isConnected = true;
            setUIEnabled(true);
            chatInput.focus();

            conn.on('data', (data) => handleReceivedMessage(data));
            conn.on('close', () => {
                setStatus('连接已断开', true);
                isConnected = false;
                setUIEnabled(false);
                connection = null;
                setTimeout(() => resetToInitial(), 100);
            });
            conn.on('error', (err) => setStatus('连接错误: ' + err.message, true));

            setStatus(isInitiator ? '已连接到 ' + conn.peer : '已接受来自 ' + conn.peer + ' 的连接');
            appendMessage('系统', '连接成功，可以开始聊天', false);
        }

        function createRoom(roomId) {
            if (!roomId.trim()) { setStatus('请输入房间标识', true); return; }
            resetToInitial();
            const hostId = 'host-' + roomId.trim();
            myPeerId = hostId;
            peer = new Peer(hostId, { debug: 0 });

            peer.on('open', (id) => {
                setStatus('主机已创建，ID: ' + id + '  (房间标识: ' + roomId + ')');
                actionBtn.textContent = '等待客户端连接…';
                actionBtn.disabled = true;
                roomInput.disabled = true;
                roomInput.classList.add('disabled-input');
            });

            peer.on('connection', (conn) => {
                if (connection) { conn.close(); setStatus('已有连接，拒绝新连接', true); return; }
                remotePeerId = conn.peer;
                setStatus('收到来自 ' + remotePeerId + ' 的连接请求');
                onConnectionEstablished(conn, false);
                actionBtn.textContent = '已连接';
                actionBtn.disabled = true;
            });

            peer.on('error', (err) => {
                setStatus('Peer 错误: ' + err.message, true);
                if (err.type === 'unavailable-id') {
                    setStatus('房间标识已被占用，请更换', true);
                }
                actionBtn.disabled = false;
                actionBtn.textContent = (currentRole === 'host') ? '创建房间' : '加入房间';
                roomInput.disabled = false;
                roomInput.classList.remove('disabled-input');
                peer.destroy();
                peer = null;
            });
        }

        function joinRoom(roomId) {
            if (!roomId.trim()) { setStatus('请输入房间标识', true); return; }
            resetToInitial();
            const hostId = 'host-' + roomId.trim();
            remotePeerId = hostId;
            peer = new Peer({ debug: 0 });

            peer.on('open', (id) => {
                myPeerId = id;
                setStatus('客户端 ID: ' + id + '，正在连接主机 ' + hostId + '…');
                const conn = peer.connect(hostId, { reliable: true });
                conn.on('open', () => {
                    setStatus('连接成功 (主机: ' + hostId + ')');
                    onConnectionEstablished(conn, true);
                    actionBtn.textContent = '已连接';
                    actionBtn.disabled = true;
                    roomInput.disabled = true;
                    roomInput.classList.add('disabled-input');
                });
                conn.on('error', (err) => {
                    setStatus('连接失败: ' + err.message, true);
                    actionBtn.disabled = false;
                    actionBtn.textContent = '加入房间';
                    roomInput.disabled = false;
                    roomInput.classList.remove('disabled-input');
                    try { conn.close(); } catch(e) {}
                    connection = null;
                    peer.destroy();
                    peer = null;
                });
            });

            peer.on('error', (err) => {
                setStatus('Peer 错误: ' + err.message, true);
                actionBtn.disabled = false;
                actionBtn.textContent = '加入房间';
                roomInput.disabled = false;
                roomInput.classList.remove('disabled-input');
                peer.destroy();
                peer = null;
            });
        }

        // 操作按钮点击
        actionBtn.addEventListener('click', function() {
            const roomId = roomInput.value.trim();
            if (!roomId) { setStatus('请填写房间标识', true); return; }
            if (currentRole === 'host') {
                createRoom(roomId);
            } else {
                joinRoom(roomId);
            }
        });

        sendBtn.addEventListener('click', function() {
            const text = chatInput.value.trim();
            if (!text) return;
            sendChatMessage(text);
        });

        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendBtn.click();
            }
        });

        // 角色切换
        btnHost.addEventListener('click', function() {
            if (currentRole === 'host') return;
            currentRole = 'host';
            btnHost.classList.add('active');
            btnClient.classList.remove('active');
            actionBtn.textContent = '创建房间';
            roomInput.disabled = false;
            roomInput.classList.remove('disabled-input');
            resetToInitial();
            setStatus('已切换至主机模式');
        });

        btnClient.addEventListener('click', function() {
            if (currentRole === 'client') return;
            currentRole = 'client';
            btnClient.classList.add('active');
            btnHost.classList.remove('active');
            actionBtn.textContent = '加入房间';
            roomInput.disabled = false;
            roomInput.classList.remove('disabled-input');
            resetToInitial();
            setStatus('已切换至客户端模式');
        });

        // 初始化
        btnHost.classList.add('active');
        btnClient.classList.remove('active');
        actionBtn.textContent = '创建房间';
        setStatus('就绪 · 点击创建房间');
        setUIEnabled(false);

        window.addEventListener('beforeunload', function() {
            if (peer) try { peer.destroy(); } catch(e) {}
        });
    })();
</script>
</body>
</html>
